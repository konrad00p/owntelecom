name: OwnTelecom
version: 1.0.0
main: pl.owntelecom.OwnTelecom
api-version: 1.20
depend: [Vault]
authors: [TwojaNazwa]
description: System telekomunikacyjny dla serwerów Minecraft

commands:
  telefon:
    description: Główne komendy systemu telekomunikacyjnego
    usage: /telefon <info>
  call:
    description: Dzwoni do innego gracza
    usage: /call <nick>
  sms:
    description: Wysyła SMS do innego gracza
    usage: /sms <nick> <treść>
  odbierz:
    description: Odbiera połączenie
    usage: /odbierz
  rozlacz:
    description: Rozłącza połączenie
    usage: /rozlacz
  alarmowy:
    description: Wysyła zgłoszenie alarmowe
    usage: /alarmowy <treść>
    aliases: [112]
  operator:
    description: Zarządzanie operatorem
    usage: /operator <utworz/usun/przekaz/ustawienia>
  stacja:
    description: Zarządzanie stacjami bazowymi
    usage: /stacja <utworz/ulepsz/usun/info> [id_operatora]
  internet:
    description: Otwiera przeglądarkę internetową
    usage: /internet [strona]
  allegro:
    description: Otwiera globalny sklep Allegro
    usage: /allegro
  chat:
    description: Zarządzanie chatem lokalnym i globalnym
    usage: /chat <wlacz/wylacz/status/promien/toggle>
    permission: owntelecom.admin
  operator:
    description: Zarządzanie operatorami sieci komórkowych
    usage: /operator <utworz/usun/pr
  umowa:
    description: Zarządzanie umowami między operatorami
    usage: /umowa <zaproponuj/akceptuj/odrzuc/zerwij/strefy/roaming>
  zasieg:
    description: Sprawdza stan sieci - /zasieg (obecny) lub /zasieg all (wszystkie)
    usage: /zasieg [all]
    aliases: [zasiegall, siec, sygnal, network]
  przelacz:
    description: Przełącza do innego operatora
    usage: /przelacz <operator/auto/home>
    aliases: [switch, connect]
  roaming:
    description: Włącza/wyłącza automatyczny roaming
    usage: /roaming <wlacz/wylacz>

permissions:
  owntelecom.admin:
    description: Pełny dostęp administracyjny
    default: op
  owntelecom.user:
    description: Podstawowy dostęp dla graczy
    default: true
